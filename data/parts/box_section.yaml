# Heavy box weldment: four 30 mm side plates on a 20 mm base.
# Corner seams L1-L4 are single-V butt joints; base seams B1-B4 are multi-pass fillets.
part: BOX-30
material: {name: "Q&T structural steel (generic)", density_kg_m3: 7850, c_j_kgk: 470}
thermal:
  ambient_c: 20.0
  start_c: 25.0
  zone_width_mm: 100        # width of the locally heated band along a seam
  local_fraction: 0.7       # share of a pass's heat that shows up as local excess
  tau_local_s: 900
  tau_bulk_s: 10800
  heater_kw: 60
plates:
  - {id: S1, t_mm: 30, length_mm: 1800, width_mm: 600}
  - {id: S2, t_mm: 30, length_mm: 1800, width_mm: 600}
  - {id: S3, t_mm: 30, length_mm: 1800, width_mm: 600}
  - {id: S4, t_mm: 30, length_mm: 1800, width_mm: 600}
  - {id: BASE, t_mm: 20, length_mm: 1800, width_mm: 1000}
# side: unit direction of the angular-distortion pull; orient: positioner [tilt, rotate] in degrees
seams:
  - {id: L1, joint: V, t_mm: 30, angle_deg: 60, gap_mm: 2, face_mm: 2, length_mm: 1800, side: [1, 1],   orient: [0, 45]}
  - {id: L2, joint: V, t_mm: 30, angle_deg: 60, gap_mm: 2, face_mm: 2, length_mm: 1800, side: [-1, 1],  orient: [0, 135]}
  - {id: L3, joint: V, t_mm: 30, angle_deg: 60, gap_mm: 2, face_mm: 2, length_mm: 1800, side: [-1, -1], orient: [0, 225]}
  - {id: L4, joint: V, t_mm: 30, angle_deg: 60, gap_mm: 2, face_mm: 2, length_mm: 1800, side: [1, -1],  orient: [0, 315]}
  - {id: B1, joint: FILLET, t_mm: 20, leg_mm: 10, length_mm: 1800, side: [1, 0],  orient: [90, 0]}
  - {id: B2, joint: FILLET, t_mm: 20, leg_mm: 10, length_mm: 1800, side: [-1, 0], orient: [90, 180]}
  - {id: B3, joint: FILLET, t_mm: 20, leg_mm: 10, length_mm: 1000, side: [0, 1],  orient: [90, 90]}
  - {id: B4, joint: FILLET, t_mm: 20, leg_mm: 10, length_mm: 1000, side: [0, -1], orient: [90, 270]}
