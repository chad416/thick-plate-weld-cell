[project]
name = "weldcell"
version = "0.1.0"
description = "Robotic multi-pass weld cell for thick-plate weldments, in simulation: pass and sequence planning, IEC 61131-3 ST cell logic tested in CI, SCL export, weld records"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E402", "B905"]
